name: Build and push container image for Caliban
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/entoaq/caliban:latest
            ghcr.io/entoaq/caliban:${{ github.sha }}

      - name: Print the exact deploy command to run
        run: |
          echo "::notice::Run this in Cloud Shell to deploy this exact build:"
          echo "::notice::az webapp config container set --name Caliban --resource-group Caliban_group --container-image-name ghcr.io/entoaq/caliban:${{ github.sha }}"
