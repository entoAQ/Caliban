name: Build and push container image for Caliban

# Two costs sit between a commit and a working service, and they have separate
# fixes.
#
# Building the image. Almost all of it is `pip install`, which redoes work that
# has not changed -- requirements.txt moves once a month, app/ moves several
# times an hour. The registry cache below makes an app-only change reuse the
# dependency layer, taking the build from minutes to seconds.
#
# Getting App Service to run the new image. That was a manual az command
# followed by waiting for a restart, which is why a run of small fixes hurt so
# much: every one cost a full pull and cold start with someone watching for the
# build to finish first. The deploy step below does it as soon as the image is
# pushed, so the wait starts immediately and unattended.

on:
  push:
    branches:
      - main
    # Documentation and rig code do not go into the image, and rebuilding for
    # them wastes minutes and warms nothing.
    paths-ignore:
      - 'rig/**'
      - '**/*.md'
      - '**/*.sql'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Lifted to job level because the secrets context is not reliably
      # available in a step's `if`, while the env context is. Testing the
      # secret directly in the condition silently never matches -- the step is
      # skipped forever and nothing says why.
      AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      # Needed for the registry cache; the default docker driver cannot export
      # cache manifests.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/entoaq/caliban:latest
            ghcr.io/entoaq/caliban:${{ github.sha }}
          # Cached in the registry rather than in GitHub's action cache, which
          # is capped at 10GB per repository and evicts on its own schedule.
          cache-from: type=registry,ref=ghcr.io/entoaq/caliban:buildcache
          cache-to: type=registry,ref=ghcr.io/entoaq/caliban:buildcache,mode=max

      # Point App Service at the image just built and restart it.
      #
      # Done here rather than by a registry webhook because this app's
      # Deployment Center source is GitHub Actions, not Container Registry --
      # there is no webhook URL to call in that mode, and Azure cannot read a
      # private GHCR image to poll it either.
      #
      # Deployed by SHA rather than :latest. It costs nothing here, since the
      # workflow knows exactly which build it just produced, and it means the
      # running image is always identifiable and a rollback is the same command
      # with an older SHA.
      #
      # Skipped rather than failed when the secret is absent, so a fork or a
      # fresh clone still builds. Without it the deploy is the manual command
      # printed below, exactly as before.
      - name: Deploy to App Service
        if: env.AZURE_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: Caliban
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/entoaq/caliban:${{ github.sha }}

      # Wait until the live service reports the commit we just built.
      #
      # App Service keeps serving the old container while the new one starts,
      # so a green deploy step means "accepted", not "running". Every time we
      # have been unsure whether a fix was actually live, this is the question
      # we were really asking, and answering it by looking for expected
      # behaviour is guesswork.
      #
      # Never fails the build. The image is pushed and the deploy is accepted
      # either way; a slow cold start is not a broken build, and a red X here
      # would say the wrong thing.
      - name: Wait for the new build to go live
        if: env.AZURE_PUBLISH_PROFILE != ''
        continue-on-error: true
        run: |
          url="https://caliban-ascchkhycdeuf9ew.canadacentral-01.azurewebsites.net/health"
          want="${{ github.sha }}"
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$url" | jq -r '.build_sha // empty') || live=""
            if [ "$live" = "$want" ]; then
              echo "::notice::Live after $((i * 10))s: $want"
              exit 0
            fi
            echo "waiting $((i * 10))s -- live=${live:-unreachable}"
            sleep 10
          done
          echo "::warning::Still not reporting $want after 10 minutes (last seen: ${live:-unreachable})."

      - name: How to deploy this exact build
        run: |
          echo "::notice::Image pushed: ghcr.io/entoaq/caliban:${{ github.sha }}"
          echo "::notice::If auto-deploy is not configured, run in Cloud Shell:"
          echo "::notice::az webapp config container set --name Caliban --resource-group Caliban_group --container-image-name ghcr.io/entoaq/caliban:${{ github.sha }}"
          echo "::notice::To roll back, run the same command with an older SHA."
