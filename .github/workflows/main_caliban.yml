# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - Caliban
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/appsvc/python:3.12_20260504.4.tuxprod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies into antenv
        run: |
          pip install --target=antenv/lib/python3.12/site-packages -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Package
        run: zip -rq deploy.zip . -x "deploy.zip"

      - name: Extract Kudu credentials
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          for profile in root.findall('publishProfile'):
              if profile.get('publishMethod') == 'MSDeploy':
                  print(f\"::add-mask::{profile.get('userPWD')}\")
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write(f\"KUDU_USER={profile.get('userName')}\n\")
                      f.write(f\"KUDU_PASS={profile.get('userPWD')}\n\")
                  break
          "

      - name: Deploy directly via Kudu zipdeploy (bypasses OneDeploy)
        run: |
          curl --fail --show-error \
            -X POST \
            -u "$KUDU_USER:$KUDU_PASS" \
            -H "Content-Type:" \
            -T deploy.zip \
            "https://caliban-ascchkhycdeuf9ew.scm.canadacentral-01.azurewebsites.net/api/zipdeploy"
