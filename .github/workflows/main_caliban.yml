# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - Caliban
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/appsvc/python:3.12_20260504.4.tuxprod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies into antenv
        run: |
          pip install --target=antenv/lib/python3.12/site-packages -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy directly via Kudu zipdeploy (bypasses OneDeploy)
        run: |
          echo "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" > publish_profile.xml
          USERNAME=$(grep -o 'userName="[^"]*"' publish_profile.xml | head -1 | sed 's/userName="//;s/"//')
          PASSWORD=$(grep -o 'userPWD="[^"]*"' publish_profile.xml | head -1 | sed 's/userPWD="//;s/"//')
          rm publish_profile.xml
          zip -r deploy.zip . -x "deploy.zip"
          curl --fail --show-error \
            -X POST \
            -u "$USERNAME:$PASSWORD" \
            --data-binary @deploy.zip \
            "https://caliban-ascchkhycdeuf9ew.scm.canadacentral-01.azurewebsites.net/api/zipdeploy"
