<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cadran épierreur — 150 mm</title>
<style>
  @page { size: letter portrait; margin: 12mm; }
  html, body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #000; background: #fff; }
  .sheet { display: flex; flex-direction: column; align-items: center; gap: 4mm; }
  .note { font-size: 9pt; width: 170mm; }
  svg { display: block; }
  @media print { .note.screen-only { display: none; } }
</style>
</head>
<body>
<div class="sheet">
  <p class="note screen-only"><strong>Imprimer à 100 % (taille réelle), sans « ajuster à la page ».</strong>
    Vérifier ensuite la barre de contrôle à la règle : elle doit mesurer exactement 100 mm.</p>

  <!-- All units are millimetres: the viewBox is 170 x 195 and the element is 170mm x 195mm. -->
  <svg width="170mm" height="195mm" viewBox="0 0 170 195" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(85 85)" fill="none" stroke="#000">
      <!-- Cut line: the 150 mm disc. -->
      <circle r="75" stroke-width="0.6"/>
      <!-- Inner guide ring the marks start from. -->
      <circle r="62" stroke-width="0.25" stroke-dasharray="1.5 1.5"/>

      <!-- 8 marks, 45 degrees apart, one at the top. -->
      <g stroke-width="1.2" stroke-linecap="butt">
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(0)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(45)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(90)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(135)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(180)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(225)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(270)"/>
        <line x1="0" y1="-75" x2="0" y2="-62" transform="rotate(315)"/>
      </g>


      <!-- Centre: cross and a 6 mm ring to locate the shaft or pointer. -->
      <g stroke-width="0.35">
        <line x1="-8" y1="0" x2="8" y2="0"/>
        <line x1="0" y1="-8" x2="0" y2="8"/>
        <circle r="3"/>
      </g>
    </g>

    <!-- 100 mm print-scale check bar. -->
    <g transform="translate(35 178)" stroke="#000" stroke-width="0.4" fill="none">
      <line x1="0" y1="0" x2="100" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="50" y1="-2" x2="50" y2="2"/>
      <line x1="100" y1="-3" x2="100" y2="3"/>
    </g>
    <text x="85" y="188" font-size="3.5" text-anchor="middle" font-family="Arial, sans-serif">
      Barre de contrôle : 100 mm exactement — cadran Ø 150 mm, 8 repères à 45°
    </text>
  </svg>
</div>
</body>
</html>
